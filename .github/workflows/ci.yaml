name: CI
on:
  push:
    branches:
      - master
  pull_request:

env:
  # Etherscan API keys.
  ARBISCAN_API_KEY: ${{ secrets.ARBISCAN_API_KEY }}
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }} # Mainnet.
  OPTIMISTIC_ETHERSCAN_API_KEY: ${{ secrets.OPTIMISTIC_ETHERSCAN_API_KEY }}
  POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
  # Subgraphs
  PONDER_SUBGRAPH_URL: /api/ponder
  # Other.
  MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
  POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
  OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
  ARBITRUM_ONE_RPC_URL: ${{ secrets.ARBITRUM_ONE_RPC_URL }}
  SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
  FOUNDRY_PROFILE: ci
  WALLET_CONNECT_PROJECT_ID: ${{ secrets.WALLET_CONNECT_PROJECT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: nightly

      - run: yarn install --immutable

      - run: yarn build
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: nightly

      - run: yarn install --immutable

      - name: Run tests
        run: yarn test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: nightly

      - run: yarn install --immutable

      - name: Run coverage
        run: yarn coverage

      # Install lcov from its release rather than Ubuntu's package, since genhtml before 2.6 rejects
      # functions that start on a line with no line coverage data, which umbra-js's report has.
      - name: Install lcov
        env:
          LCOV_VERSION: "2.6"
          LCOV_SHA256: 67a45db99b8ef0260c3fac9a2e3749fd8fa350a15e235dd3c29b356d97755c75
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl libjson-perl libperlio-gzip-perl libtimedate-perl
          cd "$RUNNER_TEMP"
          curl -fsSL -o lcov.tar.gz "https://github.com/linux-test-project/lcov/releases/download/v${LCOV_VERSION}/lcov-${LCOV_VERSION}.tar.gz"
          echo "${LCOV_SHA256}  lcov.tar.gz" | sha256sum --check
          tar -xzf lcov.tar.gz
          sudo make -C "lcov-${LCOV_VERSION}" install PREFIX=/usr/local LCOV_NO_DOC=1 LCOV_NO_XS=1
          lcov --version

      - name: Merge directories
        run: |
          lcov \
            --add-tracefile ./contracts-periphery/lcov.info \
            --add-tracefile ./umbra-js/coverage/lcov.info  \
            --output-file lcov.info \
            --rc branch_coverage=1

      # This step posts a detailed coverage report as a comment and deletes previous comments on
      # each push. The below step is used to fail coverage if the specified coverage threshold is
      # not met. The below step can post a comment (when it's `github-token` is specified) but it's
      # not as useful, and this action cannot fail CI based on a minimum coverage threshold, which
      # is why we use both in this way.
      - name: Post coverage report
        if: github.event_name == 'pull_request' # This action fails when ran outside of a pull request.
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          delete-old-comments: true
          lcov-file: ./lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }} # Adds a coverage summary comment to the PR.

      - name: Verify minimum coverage
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: ./lcov.info
          minimum-coverage: 70 # Set coverage threshold.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.9

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install scopelint
        uses: engineerd/configurator@v0.0.8
        with:
          name: scopelint
          repo: ScopeLift/scopelint
          fromGitHubReleases: true
          version: v0.0.21
          pathInArchive: scopelint-x86_64-linux/scopelint
          urlTemplate: https://github.com/ScopeLift/scopelint/releases/download/{{version}}/scopelint-x86_64-linux.tar.xz
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: yarn install --immutable

      # The type-aware lint rules need the generated contract types and the umbra-js build output.
      - run: yarn build-umbra-js

      - name: Check lint and formatting
        run: yarn lint

      - name: Run scopelint
        run: |
          cd contracts-periphery
          scopelint --version
          FOUNDRY_DISABLE_NIGHTLY_WARNING=true scopelint check
