# Don't run the install scripts of dependencies. None of ours need them: native modules use prebuilt
# binaries or fall back to JavaScript, and the rest print messages or have unwanted side effects. To
# allow one package's scripts, set dependenciesMeta.<name>.built to true in package.json.
enableScripts: false

# Netlify, hardhat, and the Quasar/webpack toolchain all expect a node_modules tree.
nodeLinker: node-modules

# Only resolve package versions that have been published for at least two weeks, which gives
# the ecosystem time to catch and pull compromised releases before we install them.
npmMinimalAgeGate: 14d
